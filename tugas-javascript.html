<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Daftar Produk</title>
  <style>
    .product {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
      width: 200px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      height: auto;
    }
    .product-container {
      display: flex;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <h1>Daftar Produk</h1>
  <input type="text" id="filter-input" placeholder="Cari produk..." />
  <div id="product-list" class="product-container"></div>

  <script src="js.js"></script>
</body>
</html>
